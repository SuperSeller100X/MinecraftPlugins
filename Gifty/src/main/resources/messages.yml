# ============================================================
#  Gifty messages
#  Supports '&' color codes and hex colors (&#RRGGBB).
#  {prefix} is replaced with the prefix below.
# ============================================================

prefix: '&8[&dGifty&8]&r '

errors:
  players-only: '{prefix}&cThis command can only be used by players.'
  no-permission: '{prefix}&cYou don''t have permission to do this.'

send:
  usage: '{prefix}&eUsage: &f/gift <player>'
  not-found: '{prefix}&cPlayer &e{player}&c was not found.'
  self: '{prefix}&cYou cannot gift yourself.'
  session-open: '{prefix}&cClose your current gift menu first.'
  no-content: '{prefix}&cYour gift is empty! Add items, money or a message.'
  cooldown: '{prefix}&cYou can send again in &e{time}&c.'
  full: '{prefix}&c{player}''s inbox is full.'
  money-disabled: '{prefix}&cEconomy is not enabled on this server.'
  no-money-perm: '{prefix}&cYou don''t have permission to send money.'
  no-message-perm: '{prefix}&cYou don''t have permission to add a message.'
  insufficient: '{prefix}&cYou don''t have enough money. &7(Balance: {balance})'
  blacklisted: '{prefix}&c{item} cannot be gifted on this server.'
  success: '{prefix}&aGift sent to &e{player}&a!'
  notify: '{prefix}&dYou received a gift from &e{player}&d! &7Use &f/inbox&7 to open it.'

inbox:
  nothing: '{prefix}&cThat gift has nothing of that kind.'
  claim-items: '{prefix}&aClaimed the items from gift &e#{id}&a.'
  claim-money: '{prefix}&aClaimed &e{money}&a from gift &e#{id}&a.'
  claim-all: '{prefix}&aClaimed everything from gift &e#{id}&a.'
  claim-all-money: '{prefix}&aClaimed &e{money}&a from your inbox.'
  overflow: '{prefix}&eYour inventory is full — some items were dropped at your feet.'
  returned: '{prefix}&eYour unsent gift items were returned to you.'
  notify-join: '{prefix}&dYou have &e{count}&d pending gift(s)! &7Use &f/inbox&7 to open them.'

admin:
  usage: '{prefix}&eUsage: &f/giftadmin <reload|view <player> [page]|clear <player>|expire <player>|info>'
  reload: '{prefix}&aConfiguration reloaded.'
  view-usage: '{prefix}&eUsage: &f/giftadmin view <player> [page]'
  clear-usage: '{prefix}&eUsage: &f/giftadmin clear <player>'
  expire-usage: '{prefix}&eUsage: &f/giftadmin expire <player>'
  cleared: '{prefix}&aCleared &e{count}&a gift(s) from &e{player}&a''s inbox.'
  expired: '{prefix}&aRefunded &e{count}&a gift(s) back to their senders.'
  refund-message: '&7Refund: your gift to &f{player}&7 (unclaimed #&f{id}&7).'
  expire-message: '&7Expired: your gift to &f{player}&7 (unclaimed #&f{id}&7).'
  refunded-notify: '{prefix}&eA gift you sent to &e{player}&e was refunded to you.'
  expired-notify: '{prefix}&eA gift you sent to &e{player}&e expired and was refunded.'
  info-version: '{prefix}&7Version: &f{version}'
  info-economy: '{prefix}&7Economy: &f{provider}'
  info-slots: '{prefix}&7Gift slots: &f{slots}'
  info-capacity: '{prefix}&7Inbox capacity: &f{capacity}'
  info-pages: '{prefix}&7Inbox pages: &f{pages}'

prompt:
  money: '{prefix}&eType the amount of money to include &7(or &fcancel&7 / &f0&7). &7Short forms work: &f1.5k&7, &f2m&7, &f1q&7&e:'
  message: '{prefix}&eType your message &7(or &fnone&7 to remove it, &fcancel&7 to keep)&e:'
  cancelled: '{prefix}&7Cancelled.'
  invalid: '{prefix}&cThat''s not a valid amount.'
  timeout: '{prefix}&cInput timed out.'

gui:
  compose-title: '&8Gift to &d{player}'
  compose-hint-name: '&ePlace your gift items here'
  compose-hint-lore: '&7Place items in the slots above.&n&7Press ESC when done.'
  confirm-title: '&8Confirm Gift to &d{player}'
  confirm-items-name: '&eItems'
  confirm-items-count: '&7Included items: &f{count}'
  confirm-money-name: '&eMoney'
  confirm-money-value: '&7Amount: &f{money}'
  confirm-money-hint: '&7Click to set the amount'
  confirm-message-name: '&eMessage'
  confirm-message-none: '&7No message'
  confirm-message-set: '&7&o{message}'
  confirm-message-hint: '&7Click to write a message'
  confirm-cancel-name: '&cCancel'
  confirm-cancel-lore: '&7Cancel and get your items back'
  confirm-send-name: '&a&lSend Gift'
  confirm-send-lore: '&7Deliver to the player''s inbox'
  confirm-abandoned: '{prefix}&cGift cancelled — your items were returned.'
  inbox-title: '&8Inbox &7(Page {page}/{pages})'
  inbox-title-other: '&8Inbox of &d{player} &7(Page {page}/{pages})'
  inbox-empty-name: '&eNo gifts yet'
  inbox-empty-lore: '&7Gifts sent to you will appear here.'
  close-name: '&cClose'
  page-prev-name: '&ePrevious page'
  page-prev-lore: '&7Go to the previous page'
  page-info-name: '&ePage {page} of {pages}'
  page-info-lore: '&7{page} of {pages}'
  page-next-name: '&eNext page'
  page-next-lore: '&7Go to the next page'
  claim-all-money-name: '&eClaim all money'
  claim-all-money-lore: '&7Total: &f{money}'
  delivery-name: '&eGift &f#{id} &7from &b{player}'
  delivery-from: '&7From: &f{player}'
  delivery-date: '&7Sent: &f{date}'
  delivery-items: '&7Items: &f{count}'
  delivery-item-line: '&7 - &f{type} &8x{amount}'
  delivery-more: '&7 ... and &f{count}&7 more'
  delivery-money: '&7Money: &f{money}'
  delivery-message-header: '&7Message:'
  delivery-message-line: '&7&o{line}'
  delivery-hint-left: '&7Left-click: &fclaim items'
  delivery-hint-right: '&7Right-click: &fclaim money'
  delivery-hint-shift: '&7Shift-click: &fclaim all'
