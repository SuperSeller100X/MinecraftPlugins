prefix: "&8[&dSubscriptions&8] &r"

generic:
  players-only: "&cPlayers only."
  no-permission: "&cYou do not have permission to do that."
  unknown-command: "&cUnknown subcommand. Use &e/sub help&c."
  unknown-plan: "&cThat plan does not exist."
  unknown-sub: "&cThat subscription was not found."
  economy-missing: "&cNo economy plugin is hooked. Money features are disabled."
  cancelled-input: "&7Cancelled."
  timeout-input: "&cThat prompt timed out."
  reload: "&aConfiguration reloaded. Active subscriptions were not reset."
  number-invalid: "&cThat is not a valid number. Try &e10k&c, &e2.5m&c, &e1b&7."
  time-invalid: "&cThat is not a valid duration. Try &e10m&c, &e1h&c, &e1d&c, &e1w&c."

prompt:
  name: "&eType the plan name in chat, or &ccancel&e."
  description: "&eType the plan description in chat, or &ccancel&e."
  price: "&eType the price per cycle (&e1k&7, &e2.5m&7, &e1b&7), or &ccancel&e."
  interval: "&eType the real-time interval (&e10m&7, &e1h&7, &e1d&7), or &ccancel&e."
  command: "&eType the command without a leading slash. Prefix with &fconsole: &efor console. Or &ccancel&e."
  permission: "&eType the LuckPerms permission node, or &ccancel&e."
  group: "&eType the LuckPerms group / rank name, or &ccancel&e."
  money-reward: "&eType how much money the subscriber receives each cycle, or &ccancel&e."
  search: "&eType a search query, or &ccancel&e."
  max-subs: "&eType the maximum number of subscribers (0 = unlimited), or &ccancel&e."
  max-cycles: "&eType the maximum number of billing cycles (0 = until cancelled), or &ccancel&e."
  signup-fee: "&eType the one-time signup fee (0 = none), or &ccancel&e."
  trial: "&eType how many free trial cycles to give (0 = none), or &ccancel&e."

plan:
  created: "&aCreated plan &f{id} &7({name}&7)."
  published: "&aPublished &f{name}&a. Players can subscribe from the marketplace."
  unpublished: "&eUnlisted &f{name}&e. Existing subscribers keep their subscription."
  deleted: "&cDeleted plan &f{name}&c."
  not-owner: "&cYou do not own that plan."
  no-rewards: "&cAdd at least one reward before publishing."
  no-capacity: "&cThat plan is full."
  not-joinable: "&cThat plan is not accepting new subscribers."
  already-subscribed: "&cYou already have an active subscription to that plan."
  too-many-plans: "&cYou already have {max} plans."
  too-many-subs: "&cYou already have {max} active subscriptions."
  too-many-rewards: "&cThis plan already has the maximum number of rewards."
  blacklisted: "&cThat item is not allowed as a reward."
  stock-added: "&aDeposited &f{amount} &akit(s). Stock is now &f{stock}&a."
  stock-empty: "&e{name} &cis out of stock. Subscribers will not be charged."
  infinite-denied: "&cYou cannot mark plans as infinite stock."
  command-denied: "&cYou cannot attach command rewards."
  permission-denied: "&cYou cannot attach permission rewards."
  group-denied: "&cYou cannot attach rank rewards."
  price-denied: "&cThat price is outside the allowed range ({min} – {max})."
  interval-denied: "&cThat interval is outside the allowed range ({min} – {max})."

sub:
  started: "&aSubscribed to &f{name}&a. First charge: &e{when}&a."
  cancelled: "&eCancelled your subscription to &f{name}&e."
  paused: "&ePaused your subscription to &f{name}&e."
  resumed: "&aResumed your subscription to &f{name}&a."
  policy: "&aYour policy for &f{name} &ais now &e{policy}&a."
  charged: "&aPaid &e{amount} &afor &f{name}&a. Next cycle in &e{when}&a."
  trial: "&aTrial delivery for &f{name}&a. Next cycle in &e{when}&a."
  skipped: "&eSkipped a cycle of &f{name}&e ({reason}). Next try in &e{when}&e."
  auto-paused: "&eYour subscription to &f{name} &ewas paused: &c{reason}&e."
  auto-cancelled: "&cYour subscription to &f{name} &cwas cancelled: {reason}&c."
  expired: "&eYour subscription to &f{name} &ereached its last cycle."
  seller-paid: "&a{player} paid you &e{amount} &afor &f{name}&a."
  cannot-cancel: "&cYou cannot cancel that subscription."

inbox:
  delivered: "&aA delivery from &f{name} &alanded in your inbox. &7/subinbox"
  claimed: "&aClaimed &f{amount} &aitem(s)."
  claimed-all: "&aClaimed everything that fit in your inventory."
  full: "&cYour inventory is full. Make space and try again."
  empty: "&7Your inbox is empty."
  inbox-full: "&cYour subscription inbox is full. Claim items before the next cycle."

admin:
  gave: "&aGave &f{player} &aa subscription to &f{name}&a."
  cancelled: "&eForce-cancelled subscription &f{id}&e."
  forcebill: "&aRan a billing pass."
  webhook-ok: "&aWebhook test sent."
  webhook-missing: "&cNo webhook URL is configured."
  stats: "&ePlans: &f{plans} &8• &eLive subs: &f{subs} &8• &eInbox: &f{inbox} &8• &eEconomy: &f{economy}"

help:
  - "&d&lSubscriptions"
  - "&e/sub &7— main menu"
  - "&e/sub browse [query] &7— marketplace"
  - "&e/sub create &7— create a plan"
  - "&e/sub info <plan> &7— plan details"
  - "&e/sub subscribe <plan> &7— subscribe"
  - "&e/sub cancel <id> &7— cancel yours"
  - "&e/sub pause <id> &7— pause / resume"
  - "&e/sub policy <id> <pause|skip|cancel>"
  - "&e/sub inbox &7— claim deliveries"
  - "&e/sub mysubs &7— your subscriptions"
  - "&e/sub myplans &7— plans you own"
  - "&e/sub history &7— charge log"
  - "&e/subadmin reload|give|cancel|stats|forcebill|webhook"
