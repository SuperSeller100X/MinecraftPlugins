name: XPBank build

on:
  push:
    paths:
      - 'XPBank/**'
  pull_request:
    paths:
      - 'XPBank/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: XPBank
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test and package
        run: mvn -B -ntp clean verify
