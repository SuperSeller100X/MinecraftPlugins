# ============================================================
#  ShardTools messages (MiniMessage format)
#  Placeholders: %player%, %amount%, %balance%, %item%, %price%,
#                %time%, %minutes%, %rank%, %symbol%
# ============================================================
prefix: "<gray>[</gray><light_purple>ShardTools</light_purple><gray>]</gray> "

no-permission: "<red>You don't have permission to do that.</red>"
player-only: "<red>Only players can use this command.</red>"
invalid-player: "<red>Player <white>%player%</white> was not found.</red>"
invalid-amount: "<red>'<white>%amount%</white>' is not a valid amount.</red>"
invalid-item: "<red>Unknown item id <white>%item%</white>. Use /sta items.</red>"
unknown-command: "<red>Unknown subcommand. Try /st help.</red>"
unknown-admin-command: "<red>Unknown subcommand. Try /sta help.</red>"
admin-moved: "<red>The admin commands moved to <yellow>/sta</yellow>. Try /sta help.</red>"

balance:
  self: "<gray>Your balance: <light_purple>%symbol%%balance%</light_purple></gray>"
  other: "<gray>Balance of <white>%player%</white>: <light_purple>%symbol%%balance%</light_purple></gray>"

pay:
  sent: "<gray>Sent <light_purple>%symbol%%amount%</light_purple> to <white>%player%</white>. New balance: <light_purple>%symbol%%balance%</light_purple></gray>"
  received: "<gray>Received <light_purple>%symbol%%amount%</light_purple> from <white>%player%</white>. New balance: <light_purple>%symbol%%balance%</light_purple></gray>"
  self: "<red>You cannot pay yourself.</red>"
  insufficient: "<red>You only have <light_purple>%symbol%%balance%</light_purple>.</red>"

award:
  received: "<gray>Shard income: <light_purple>+%symbol%%amount%</light_purple> <dark_gray>(every %minutes% min)</dark_gray></gray>"
  enabled: "<gray>Automatic shard income is now <green>%state%</green>.</gray>"
  interval-set: "<gray>Shard income interval set to <yellow>%minutes% minutes</yellow>.</gray>"
  amount-set: "<gray>Shard income amount set to <yellow>%symbol%%amount%</yellow>.</gray>"

shop:
  purchased: "<gray>Purchased <white>%item%</white> for <light_purple>%symbol%%price%</light_purple>. Remaining: <light_purple>%symbol%%balance%</light_purple></gray>"
  insufficient: "<red>This costs <light_purple>%symbol%%price%</light_purple> but you only have <light_purple>%symbol%%balance%</light_purple>.</red>"
  title: "<dark_gray>Shard Shop</dark_gray> <gray>-</gray> <light_purple>%symbol%%balance%</light_purple>"
  confirm-title: "<dark_gray>Buy</dark_gray> <white>%item%</white><dark_gray>?</dark_gray>"
  price-line: "<dark_gray>Price: <light_purple>%symbol%%price%</light_purple></dark_gray>"
  balance-item: "<light_purple>Shard balance</light_purple>"
  balance-lore: "<gray>You have %symbol%%balance%</gray>"
  click-to-buy: "<yellow>Click to purchase</yellow>"
  click-to-confirm: "<green>Click to confirm</green>"
  click-to-cancel: "<red>Click to cancel</red>"
  previous-page: "<yellow>Previous page</yellow>"
  next-page: "<yellow>Next page</yellow>"
  page: "<dark_gray>Page %page% / %pages%</dark_gray>"

toggle:
  enabled: "<gray>Ability of <white>%item%</white> is now <green>enabled</green>.</gray>"
  disabled: "<gray>Ability of <white>%item%</white> is now <red>disabled</red>.</gray>"
  not-tool: "<red>Hold a shard tool with an ability to toggle it.</red>"

extend:
  title: "<dark_gray>Extra time</dark_gray> <gray>-</gray> <white>%item%</white>"
  hint: "<dark_gray>Click to pick extra time before buying</dark_gray>"
  minus: "<red>- %time%</red> <dark_gray>(-%symbol%%price%)</dark_gray>"
  plus: "<green>+ %time%</green> <dark_gray>(+%symbol%%price%)</dark_gray>"
  lifetime-line: "<gray>Lifetime: <white>%base%</white> <dark_gray>+</dark_gray> <yellow>%extra%</yellow> <dark_gray>=</dark_gray> <white>%total%</white></gray>"
  effect-line: "<gray>Haste effect: <white>%base%</white> <dark_gray>+</dark_gray> <yellow>%extra%</yellow> <dark_gray>=</dark_gray> <white>%total%</white></gray>"
  total-line: "<dark_gray>Total: <light_purple>%symbol%%price%</light_purple></dark_gray>"
  confirm: "<green>Buy for %symbol%%price%</green>"

choice:
  title: "<dark_gray>Choose enchant</dark_gray> <gray>-</gray> <white>%item%</white>"
  hint: "<dark_gray>Choose your enchant when buying</dark_gray>"
  button: "<yellow>Enchant: <green>%enchant%</green></yellow>"
  switch: "<dark_gray>Click to switch</dark_gray>"

give:
  given: "<gray>Gave <white>%amount%x %item%</white> to <white>%player%</white>.</gray>"
  received: "<gray>You received <white>%amount%x %item%</white>.</gray>"

items:
  header: "<gray>Shop items <dark_gray>(id - price - lifetime)</dark_gray>:</gray>"
  entry: "<dark_gray>-</dark_gray> <white>%item%</white> <dark_gray>%symbol%%price%</dark_gray> <gray>%time%</gray>"

price:
  set: "<gray>Price of <white>%item%</white> set to <light_purple>%symbol%%price%</light_purple>.</gray>"

catalog:
  added: "<gray>Added shop item <white>%item%</white> for <light_purple>%symbol%%price%</light_purple>. Fine-tune it with /sta edit.</gray>"
  removed: "<gray>Removed shop item <white>%item%</white> from the shop.</gray>"
  edited: "<gray>Updated <yellow>%key%</yellow> of <white>%item%</white> to <white>%value%</white>.</gray>"
  exists: "<red>An item with the id <white>%item%</white> already exists.</red>"
  invalid-material: "<red>Unknown material <white>%material%</white>.</red>"
  invalid-behavior: "<red>Unknown behavior <white>%behavior%</white>. Use NONE, AREA_PICKAXE, AREA_SHOVEL, TREE_AXE or HASTE_POTION.</red>"
  invalid-key: "<red>Unknown property <white>%key%</white>. Use name, material, price, lifetime, behavior, enchants, choices or lore.</red>"
  invalid-enchant: "<red>'<white>%enchant%</white>' is not a valid enchant. Use ids like <white>efficiency:5</white>.</red>"

buy:
  disabled: "<red>Buying shards with money is disabled on this server.</red>"
  no-vault: "<red>No economy found. Ask an admin to install Vault + an economy plugin (e.g. EssentialsX).</red>"
  below-min: "<red>The minimum purchase is <white>%min%</white> shards.</red>"
  above-max: "<red>The maximum purchase is <white>%max%</white> shards.</red>"
  insufficient-money: "<red>That costs <white>%cost%</white> but you only have <white>%balance%</white>.</red>"
  failed: "<red>The money transaction failed. Nothing was charged.</red>"
  success: "<gray>Bought <light_purple>%amount% shards</light_purple> for <white>%cost%</white>. Shard balance: <light_purple>%symbol%%balance%</light_purple></gray>"

shards:
  given: "<gray>Gave <light_purple>%symbol%%amount%</light_purple> to <white>%player%</white>. New balance: <light_purple>%symbol%%balance%</light_purple></gray>"
  taken: "<gray>Took <light_purple>%symbol%%amount%</light_purple> from <white>%player%</white>. New balance: <light_purple>%symbol%%balance%</light_purple></gray>"
  set: "<gray>Balance of <white>%player%</white> set to <light_purple>%symbol%%balance%</light_purple>.</gray>"
  insufficient: "<red><white>%player%</white> only has <light_purple>%symbol%%balance%</light_purple>.</red>"

info:
  holding: "<gray>Holding <white>%item%</white> <dark_gray>(%symbol%%price%)</dark_gray> - <yellow>%time%</yellow> remaining.</gray>"
  permanent: "never expires"
  not-holding: "<red>Hold a shard item to inspect it.</red>"

top:
  header: "<gray>Shard leaderboard:</gray>"
  entry: "<yellow>#%rank%</yellow> <white>%player%</white> <dark_gray>-</dark_gray> <light_purple>%symbol%%balance%</light_purple>"
  empty: "<gray>Nobody has any shards yet.</gray>"

expire:
  destroyed: "<red>Your <white>%item%</white> crumbled into shards of dust!</red>"
  warning: "<yellow>Your <white>%item%</white> self-destructs in <red>%time%</red>!</yellow>"

potion:
  haste: "<gray>You feel a surge of energy: <yellow>Haste II for %time%</yellow>.</gray>"

time:
  permanent: "unlimited"

reload:
  done: "<gray>Configuration, messages and shop catalog reloaded.</gray>"

help:
  header: "<gray>=== </gray><light_purple>ShardTools</light_purple><gray> ===</gray>"
  line-shop: "<yellow>/st shop</yellow> <dark_gray>(s)</dark_gray> <gray>- open the shard shop</gray>"
  line-toggle: "<yellow>/st toggle</yellow> <dark_gray>(tg)</dark_gray> <gray>- toggle the held shard tool's ability</gray>"
  line-balance: "<yellow>/st balance [player]</yellow> <dark_gray>(b)</dark_gray> <gray>- check shard balance</gray>"
  line-pay: "<yellow>/st pay <player> <amount></yellow> <dark_gray>(p)</dark_gray> <gray>- send shards</gray>"
  line-buy: "<yellow>/st buy &lt;shards&gt;</yellow> <gray>- buy shards with money</gray>"
  line-top: "<yellow>/st top [n]</yellow> <dark_gray>(t)</dark_gray> <gray>- shard leaderboard</gray>"
  line-info: "<yellow>/st info</yellow> <dark_gray>(i)</dark_gray> <gray>- inspect held shard item</gray>"
  line-admin: "<yellow>/sta</yellow> <gray>- admin commands: give, items, add, remove, edit, setprice, shards, interval, amount, award, reload <dark_gray>(op)</dark_gray></gray>"

admin-help:
  header: "<gray>=== </gray><light_purple>ShardTools Admin</light_purple><gray> ===</gray>"
  line-give: "<yellow>/sta give <player> <item> [amount] [enchant]</yellow> <dark_gray>(g)</dark_gray> <gray>- give shop items</gray>"
  line-items: "<yellow>/sta items</yellow> <dark_gray>(l)</dark_gray> <gray>- list item ids and prices</gray>"
  line-add: "<yellow>/sta add <id> <material> <price> [lifetimeHours] [behavior]</yellow> <dark_gray>(a)</dark_gray> <gray>- add a shop item</gray>"
  line-remove: "<yellow>/sta remove <id></yellow> <dark_gray>(rm)</dark_gray> <gray>- remove a shop item</gray>"
  line-edit: "<yellow>/sta edit <id> <name|material|price|lifetime|behavior|enchants|choices|lore> <value></yellow> <dark_gray>(e)</dark_gray> <gray>- edit a shop item</gray>"
  line-setprice: "<yellow>/sta setprice <item> <price></yellow> <dark_gray>(sp)</dark_gray> <gray>- change a price</gray>"
  line-shards: "<yellow>/sta shards <player> <give|take|set> <amount></yellow> <dark_gray>(sh)</dark_gray> <gray>- edit balances</gray>"
  line-interval: "<yellow>/sta interval <minutes></yellow> <dark_gray>(iv)</dark_gray> <gray>- income interval</gray>"
  line-amount: "<yellow>/sta amount <shards></yellow> <dark_gray>(am)</dark_gray> <gray>- income amount</gray>"
  line-award: "<yellow>/sta award <on|off></yellow> <dark_gray>(aw)</dark_gray> <gray>- toggle income</gray>"
  line-reload: "<yellow>/sta reload</yellow> <dark_gray>(rl)</dark_gray> <gray>- reload config</gray>"
