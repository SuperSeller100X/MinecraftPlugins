  # DonutSMP's shard shop also sells spawners (1,500) and crate keys
  # (Prime 2,500 / Crimson 2,000). Those need a spawner or crates plugin -
  # add entries like these and the purchase runs the console command
  # instead of giving a vanilla item:
  #
  # pig_spawner:
  #   material: SPAWNER
  #   name: "Pig Spawner"
  #   price: 1500
  #   lifetime-hours: 0
  #   behavior: NONE
  #   enchants: []
  #   lore: ["<gray>Pig spawner delivered by your spawner plugin.</gray>"]
  #   command: "ss give %player% pig 1"
  # prime_key:
  #   material: TRIPWIRE_HOOK
  #   name: "Prime Crate Key"
  #   price: 2500
  #   lifetime-hours: 0
  #   behavior: NONE
  #   enchants: []
  #   lore: ["<gray>One Prime crate key.</gray>"]
  #   command: "crates key %player% prime 1"

# ---------- Shard tool behaviour ----------
behavior:
  # Area breaking works for everyone holding the tool (DonutSMP style).
  # If true, the 3x3 / tree-fell only triggers while sneaking instead.
  require-sneak: false
  # Allow the area breaking in creative mode.
  allow-in-creative: false
  # Radius of the mined area. 1 = 3x3, 2 = 5x5.
  area-radius: 1
  # Vanilla-style XP for extra ore blocks broken by area mining.
  ore-xp: true
  # Never break these materials with area mining (edit freely).
  protected-materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - END_PORTAL_FRAME
    - END_PORTAL
    - REINFORCED_DEEPSLATE
    - SPAWNER
  # Protect chests, barrels, shulkers, hoppers, furnaces... from 3x3 mining.
  protect-containers: true
  # Blocks EVERY shard tool (pickaxe, axe, shovel) breaks in 3x3 mode -
  # they all share this one list, plus every *_ORE and every log.
  # Breaking a log with the axe fells the whole tree instead.
  area-materials:
    - STONE
    - COBBLESTONE
    - DEEPSLATE
    - COBBLED_DEEPSLATE
    - GRANITE
    - DIORITE
    - ANDESITE
    - TUFF
    - CALCITE
    - NETHERRACK
    - BLACKSTONE
    - BASALT
    - END_STONE
    - OBSIDIAN
    - CRYING_OBSIDIAN
    - SANDSTONE
    - RED_SANDSTONE
    - STONE_BRICKS
    - DEEPSLATE_BRICKS
    - POLISHED_BLACKSTONE_BRICKS
    - PURPUR_BLOCK
    - NETHER_BRICKS
    - QUARTZ_BLOCK
    - AMETHYST_BLOCK
    - BUDDING_AMETHYST
    - DRIPSTONE_BLOCK
    - MOSS_BLOCK
    - SCULK
    - INFESTED_STONE
    - CONCRETE
    - GLOWSTONE
    - NETHER_QUARTZ_ORE
    - NETHER_GOLD_ORE
    - ANCIENT_DEBRIS
    - DIRT
    - GRASS_BLOCK
    - COARSE_DIRT
    - ROOTED_DIRT
    - PODZOL
    - MYCELIUM
    - SAND
    - RED_SAND
    - GRAVEL
    - CLAY
    - MUD
    - SOUL_SAND
    - SOUL_SOIL
    - SNOW_BLOCK
    - TERRACOTTA
    - WHITE_TERRACOTTA
  # Vanilla XP ranges per ore for area mining ("min-max").
  ore-xp-values:
    coal_ore: "0-2"
    deepslate_coal_ore: "0-2"
    diamond_ore: "3-7"
    deepslate_diamond_ore: "3-7"
    emerald_ore: "3-7"
    deepslate_emerald_ore: "3-7"
    lapis_ore: "2-5"
    deepslate_lapis_ore: "2-5"
    redstone_ore: "1-5"
    deepslate_redstone_ore: "1-5"
    nether_gold_ore: "0-1"
    nether_quartz_ore: "2-5"

  # Tree feller (Shard Axe).
  tree:
    # DonutSMP: the axe mines all logs AND leaves connected to the tree.
    break-leaves: true
    # Maximum logs broken per swing.
    max-blocks: 256
    # Only chain through the same log type (prevents clear-cutting forests).
    same-material-only: true
    # Replant a sapling after the tree is felled (if one fits the tree type).
    replant: false

# ---------- Self-destruct ----------
expiry:
  # How often expired items are removed and warnings are checked.
  sweep-seconds: 30
  # Live tooltip countdown: keeps the red "%time%" text and the potion's
  # "%effect%" duration up to date while items are held. Display-only -
  # the refresher never writes any data to the item itself, it just
  # re-renders the visible lore from the item's creation timestamp.
  lore-refresh: true
  # How often (seconds) the display-only tooltip refresher runs.
  lore-refresh-seconds: 5
  # Warn the holder when less than these minutes remain (largest first).
  warn-minutes: [60, 10, 1]
  # Also remove expired items from chests/shulkers when opened.
  scan-opened-inventories: true

# ---------- Shard Potion of Haste ----------
haste-potion:
  # Effect duration in hours (1 by default on this server).
  duration-hours: 1
  # 0 = Haste I, 1 = Haste II, ...
  amplifier: 1
  # Potion bottle color (RGB) - aqua, matching the potion name.
  color: "#55ffff"

# ---------- Shop GUI ----------
shop:
  # Ask for a confirmation click before buying.
  confirm: false
  # GUI size in rows (max 6). Items flow into more pages automatically.
  rows: 6
  # Filler material for the border.
  filler: GRAY_STAINED_GLASS_PANE
  # Buying shards with in-game money lives in money-shop: below.

  # ---------- Buy extra time ----------
  # Clicking an EXPIRING shard item (or the haste potion) in the shop opens
  # a dialog where every buyer can stack extra time on top of the purchase:
  #   shard tools  -> extra REAL-TIME lifetime before the self-destruct
  #   haste potion -> longer EFFECT duration when drunk
  # Each +/- click adds/removes one step (shift-click = 5 steps). The extra
  # cost is steps * step-price, e.g. +6 hours on a tool = 6 x 100 = 600
  # shards on top of the base price.
  time-extension:
    enabled: true
    # Shard tools and every other expiring item: +1 hour per 100 shards.
    tool:
      step-minutes: 60
      step-price: 100
      # Never more than this many steps per purchase (24 x 1h = +24h).
      max-steps: 24
    # Haste potion effect: +30 minutes per 50 shards.
    potion:
      step-minutes: 30
      step-price: 50
      # 12 x 30min = +6h -> "6 more hours costs 600 shards".
      max-steps: 12

# ---------- Buy shards with in-game money ----------
# /st buy <shards> converts server money (whatever economy Vault exposes,
# e.g. EssentialsX Economy) into shards at cost-per-shard. Requires the
# Vault plugin + an economy provider on the server. Set enabled: false to
# turn the feature off completely.
money-shop:
  enabled: true
  cost-per-shard: 10.0     # money per shard (/st buy 100 = 1,000 money)
  min-purchase: 1          # smallest /st buy amount
  max-purchase: 100000     # largest /st buy amount

# ---------- Item protection ----------
protection:
  # Block renaming/combining shard items in anvils.
  anvil: true
  # Block disenchanting shard items in grindstones.
  grindstone: true

# ---------- DonutSMP amethyst sounds & particles ----------
# ONE amethyst step sound plays per USE of a shard tool (a 3x3 break = one
# sound, not nine); equipping a shard item (hand, armor or potion) plays the
# amethyst resonate sound. Format: "sound-id [volume] [pitch]". List = random
# pick per use; block.amethyst_cluster.step is a crunchier alternative.
effects:
  mine-sound:
    enabled: true
    sounds:
      - "block.amethyst_block.step 1.0 1.0"
  mine-particles:
    enabled: true
    id: PORTAL        # the purple portal particle
    count: 1          # per broken block - keep it subtle
  equip-sound:
    enabled: true
    sound: "block.amethyst_block.resonate 1.0 1.0"
  equip-particles:
    enabled: true
    id: PORTAL        # the purple portal particle
    count: 10         # small purple ring around the player

# ---------- Sounds ----------
# Vanilla sound ids (without the minecraft: prefix).
sounds:
  award: entity.experience_orb.pickup
  purchase: block.amethyst_block.resonate
  deny: entity.villager.no
  expire: entity.item.break
  warn: block.note_block.pling

# ---------- Worlds ----------
worlds:
  # World names where shard tool area breaking is disabled.
  disabled: []
