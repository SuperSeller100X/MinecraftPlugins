#   material      vanilla material of the item
#   name          MiniMessage display name
#   price         shard price (0 = free); override at runtime: /st setprice
#   lifetime-hours  real-time lifetime before the item self-destructs
#                   (0 = never expires). Works while the player is offline
#                   and even while the server is stopped.
#   behavior      AREA_PICKAXE | AREA_SHOVEL | TREE_AXE | HASTE_POTION | NONE
#   enchants      list of "enchant:level" (vanilla ids, e.g. efficiency:5)
#   lore          MiniMessage lore lines; %time% = remaining lifetime,
#                 %price% = current price
#
