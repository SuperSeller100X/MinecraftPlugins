# ---------- Shard tool behaviour ----------
behavior:
  # Area breaking works for everyone holding the tool (DonutSMP style).
  # If true, the 3x3 / tree-fell only triggers while sneaking instead.
  require-sneak: false
  # Allow the area breaking in creative mode.
  allow-in-creative: false
  # Radius of the mined area. 1 = 3x3, 2 = 5x5.
  area-radius: 1
  # Vanilla-style XP for extra ore blocks broken by area mining.
  ore-xp: true
  # Never break these materials with area mining (edit freely).
  protected-materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - END_PORTAL_FRAME
    - END_PORTAL
    - REINFORCED_DEEPSLATE
    - SPAWNER
  # Protect chests, barrels, shulkers, hoppers, furnaces... from 3x3 mining.
  protect-containers: true
  # Blocks EVERY shard tool (pickaxe, axe, shovel) breaks in 3x3 mode -
  # they all share this one list, plus every *_ORE and every log.
  # Breaking a log with the axe fells the whole tree instead.
  area-materials:
    - STONE
    - COBBLESTONE
    - DEEPSLATE
    - COBBLED_DEEPSLATE
    - GRANITE
    - DIORITE
    - ANDESITE
    - TUFF
    - CALCITE
    - NETHERRACK
    - BLACKSTONE
    - BASALT
    - END_STONE
    - OBSIDIAN
    - CRYING_OBSIDIAN
    - SANDSTONE
    - RED_SANDSTONE
    - STONE_BRICKS
    - DEEPSLATE_BRICKS
    - POLISHED_BLACKSTONE_BRICKS
    - PURPUR_BLOCK
    - NETHER_BRICKS
    - QUARTZ_BLOCK
    - AMETHYST_BLOCK
    - BUDDING_AMETHYST
    - DRIPSTONE_BLOCK
    - MOSS_BLOCK
    - SCULK
    - INFESTED_STONE
    - CONCRETE
    - GLOWSTONE
    - NETHER_QUARTZ_ORE
    - NETHER_GOLD_ORE
    - ANCIENT_DEBRIS
    - DIRT
    - GRASS_BLOCK
    - COARSE_DIRT
    - ROOTED_DIRT
    - PODZOL
    - MYCELIUM
    - SAND
    - RED_SAND
    - GRAVEL
    - CLAY
    - MUD
    - SOUL_SAND
    - SOUL_SOIL
    - SNOW_BLOCK
    - TERRACOTTA
    - WHITE_TERRACOTTA
  # Vanilla XP ranges per ore for area mining ("min-max").
  ore-xp-values:
    coal_ore: "0-2"
    deepslate_coal_ore: "0-2"
    diamond_ore: "3-7"
    deepslate_diamond_ore: "3-7"
    emerald_ore: "3-7"
    deepslate_emerald_ore: "3-7"
    lapis_ore: "2-5"
    deepslate_lapis_ore: "2-5"
    redstone_ore: "1-5"
    deepslate_redstone_ore: "1-5"
    nether_gold_ore: "0-1"
    nether_quartz_ore: "2-5"

  # Tree feller (Shard Axe).
  tree:
    # DonutSMP: the axe mines all logs AND leaves connected to the tree.
    break-leaves: true
    # Maximum logs broken per swing.
    max-blocks: 256
    # Only chain through the same log type (prevents clear-cutting forests).
    same-material-only: true
    # Replant a sapling after the tree is felled (if one fits the tree type).
    replant: false

# ---------- Self-destruct ----------
expiry:
  # How often expired items are removed / lore countdowns refreshed.
  sweep-seconds: 30
  # Update the "%time%" lore countdown while items are held.
  lore-refresh: true
  # Warn the holder when less than these minutes remain (largest first).
  warn-minutes: [60, 10, 1]
  # Also remove expired items from chests/shulkers when opened.
  scan-opened-inventories: true

# ---------- Shard Potion of Haste ----------
haste-potion:
  # Effect duration in hours (1 by default on this server).
  duration-hours: 1
  # 0 = Haste I, 1 = Haste II, ...
  amplifier: 1
  # Potion bottle color (RGB).
  color: "#f7ff8a"

# ---------- Shop GUI ----------
shop:
  # Ask for a confirmation click before buying.
  confirm: false
  # GUI size in rows (max 6). Items flow into more pages automatically.
  rows: 6
  # Filler material for the border.
  filler: GRAY_STAINED_GLASS_PANE

# ---------- Item protection ----------
protection:
  # Block renaming/combining shard items in anvils.
  anvil: true
  # Block disenchanting shard items in grindstones.
  grindstone: true

# ---------- DonutSMP amethyst sounds & particles ----------
# ONE amethyst step sound plays per USE of a shard tool (a 3x3 break = one
# sound, not nine); equipping a shard item (hand, armor or potion) plays the
# amethyst resonate sound. Format: "sound-id [volume] [pitch]". List = random
# pick per use; block.amethyst_cluster.step is a crunchier alternative.
effects:
  mine-sound:
    enabled: true
    sounds:
      - "block.amethyst_block.step 1.0 1.0"
  mine-particles:
    enabled: true
    id: PORTAL        # the purple portal particle
    count: 1          # per broken block - keep it subtle
  equip-sound:
    enabled: true
    sound: "block.amethyst_block.resonate 1.0 1.0"
  equip-particles:
    enabled: true
    id: PORTAL        # the purple portal particle
    count: 10         # small purple ring around the player

# ---------- Sounds ----------
# Vanilla sound ids (without the minecraft: prefix).
sounds:
  award: entity.experience_orb.pickup
  purchase: block.amethyst_block.resonate
  deny: entity.villager.no
  expire: entity.item.break
  warn: block.note_block.pling

# ---------- Worlds ----------
worlds:
  # World names where shard tool area breaking is disabled.
  disabled: []
