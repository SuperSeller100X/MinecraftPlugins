# ============================================================
#  ShardTools — DonutSMP-style shards, tools, armor and shop
#  Minecraft 26.2 (Paper / Purpur / Folia), Java 25
#
#  Every value below can be changed at runtime with commands or
#  by editing this file and running /sta reload.
# ============================================================

# ---------- Currency ----------
currency:
  # Symbol shown next to shard amounts in chat and GUIs.
  # DonutSMP uses a purple star - tags work because every message is
  # rendered through MiniMessage.
  symbol: "<light_purple>\u2726</light_purple>"
  # Balance brand-new players start with.
  start-balance: 0

# ---------- Shard income ----------
# Awards shards to every player on the server on a fixed interval.
award:
  enabled: true
  interval-minutes: 5
  amount: 5
  # Send a chat/action-bar message every time shards are awarded.
  announce: true

# ---------- Shop catalog ----------
# Every entry can be bought in /st shop and handed out with /sta give.
# Add, remove or edit entries at runtime with /sta add, /sta remove, /sta edit.
#   material      vanilla material of the item
#   name          MiniMessage display name; plain text renders in the normal
#                 (default) name color - add tags like <aqua> only on purpose
#   price         shard price (0 = free); override at runtime: /sta setprice
#   lifetime-hours  real-time lifetime before the item self-destructs
#                   (0 = never expires). Works while the player is offline
#                   and even while the server is stopped.
#   behavior      AREA_PICKAXE | AREA_SHOVEL | TREE_AXE | HASTE_POTION | NONE
#                 (all area tools share one block list; TREE_AXE also fells
#                  whole trees when the broken block is a log)
#                 NONE = no ability: the item is handed out as a plain
#                 vanilla item with only its enchantments applied (no custom
#                 name, color or lore - the name/lore below only style the
#                 shop icon). Players can pause a tool's ability with
#                 /st toggle.
#   enchants      list of "enchant:level" (vanilla ids, e.g. efficiency:5)
#   enchant-choice  optional list of enchant ALTERNATIVES - the buyer picks
#                 exactly ONE of them in the shop dialog (e.g. Fortune III
#                 vs Silk Touch). /sta give uses the first one unless an
#                 enchant name is passed as the last argument.
#   lore          MiniMessage lore lines; %time% = remaining lifetime,
#                 %price% = current price, %effect% = haste effect duration
#                 (only meaningful on the haste potion)
#
# Default prices mirror the DonutSMP shard shop (June-July 2026).
items:
  shard_pickaxe:
    material: NETHERITE_PICKAXE
    name: "Shard Pickaxe"
    price: 3000
    lifetime-hours: 24
    behavior: AREA_PICKAXE
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
    # Pick Fortune III or Silk Touch when buying.
    enchant-choice: ["fortune:3", "silk_touch:1"]
    lore:
      - "<gray>Mines a 3x3 area with every swing.</gray>"
      - "<dark_gray>Self-destructs in <red>%time%</red></dark_gray>"
  shard_axe:
    material: NETHERITE_AXE
    name: "Shard Axe"
    price: 3000
    lifetime-hours: 24
    behavior: TREE_AXE
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
    enchant-choice: ["fortune:3", "silk_touch:1"]
    lore:
      - "<gray>Fells whole trees, breaks a 3x3 area.</gray>"
      - "<dark_gray>Self-destructs in <red>%time%</red></dark_gray>"
  shard_shovel:
    material: NETHERITE_SHOVEL
    name: "Shard Shovel"
    price: 3000
    lifetime-hours: 24
    behavior: AREA_SHOVEL
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
    enchant-choice: ["fortune:3", "silk_touch:1"]
    lore:
      - "<gray>Digs a 3x3 area with every swing.</gray>"
      - "<dark_gray>Self-destructs in <red>%time%</red></dark_gray>"
  haste_potion:
    material: POTION
    name: "<aqua>Shard Potion of Haste</aqua>"
    price: 500
    lifetime-hours: 24
    # The effect lasts 1 hour; the item itself self-destructs after 24 real hours.
    behavior: HASTE_POTION
    enchants: []
    lore:
      - "<gray>Grants <yellow>Haste II for %effect%</yellow> when drunk.</gray>"
      - "<dark_gray>Self-destructs in <red>%time%</red></dark_gray>"
  netherite_pickaxe:
    material: NETHERITE_PICKAXE
    name: "Netherite Pickaxe"
    price: 1000
    lifetime-hours: 0
    behavior: NONE
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
    enchant-choice: ["fortune:3", "silk_touch:1"]
    lore:
      - "<dark_gray>Shard Shop item - never expires.</dark_gray>"
  netherite_shovel:
    material: NETHERITE_SHOVEL
    name: "Netherite Shovel"
    price: 800
    lifetime-hours: 0
    behavior: NONE
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
    lore:
      - "<dark_gray>Shard Shop item - never expires.</dark_gray>"
  netherite_axe:
    material: NETHERITE_AXE
    name: "Netherite Axe"
    price: 600
    lifetime-hours: 0
    behavior: NONE
    enchants: ["efficiency:5", "unbreaking:3", "mending:1"]
    lore:
      - "<dark_gray>Shard Shop item - never expires.</dark_gray>"
  netherite_hoe:
    material: NETHERITE_HOE
    name: "Netherite Hoe"
    price: 500
    lifetime-hours: 0
    behavior: NONE
    enchants: ["efficiency:5", "unbreaking:3", "mending:1", "silk_touch:1"]
    lore:
      - "<dark_gray>Shard Shop item - never expires.</dark_gray>"
  netherite_helmet:
    material: NETHERITE_HELMET
    name: "Netherite Helmet"
    price: 1500
    lifetime-hours: 0
    behavior: NONE
    enchants: ["protection:4", "respiration:3", "aqua_affinity:1", "unbreaking:3"]
    lore:
      - "<dark_gray>Shard Shop item - never expires.</dark_gray>"
  netherite_chestplate:
    material: NETHERITE_CHESTPLATE
    name: "Netherite Chestplate"
    price: 1500
    lifetime-hours: 0
    behavior: NONE
    enchants: ["protection:4", "unbreaking:3", "mending:1"]
    lore:
      - "<dark_gray>Shard Shop item - never expires.</dark_gray>"
  netherite_leggings:
    material: NETHERITE_LEGGINGS
    name: "Netherite Leggings"
    price: 1500
    lifetime-hours: 0
    behavior: NONE
    enchants: ["swift_sneak:3", "protection:4", "unbreaking:3", "mending:1"]
    lore:
      - "<dark_gray>Shard Shop item - never expires.</dark_gray>"
  netherite_boots:
    material: NETHERITE_BOOTS
    name: "Netherite Boots"
    price: 1500
    lifetime-hours: 0
    behavior: NONE
    enchants: ["protection:4", "feather_falling:4", "soul_speed:3", "depth_strider:3", "unbreaking:3", "mending:1"]
    lore:
      - "<dark_gray>Shard Shop item - never expires.</dark_gray>"
  netherite_sword:
    material: NETHERITE_SWORD
    name: "Netherite Sword"
    price: 1500
    lifetime-hours: 0
    behavior: NONE
