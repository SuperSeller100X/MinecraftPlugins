# This repository keeps a copy of its workflow inside each plugin folder, which
# GitHub does not pick up (only .github/workflows at the root is read). This file
# is the one that actually runs for HourGlass, and it runs the same steps.
name: HourGlass build

on:
  push:
    paths:
      - 'HourGlass/**'
      - '.github/workflows/hourglass-build.yml'
  pull_request:
    paths:
      - 'HourGlass/**'
      - '.github/workflows/hourglass-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Paper 26.2, Java 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HourGlass
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check resources against the code
        run: python3 tools/check_consistency.py

      - name: Test and package
        run: mvn -B -ntp clean verify

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: HourGlass
          path: HourGlass/target/HourGlass-*.jar
          if-no-files-found: error
