# Builds RandomStructureChallenge with JDK 25 + Maven against Paper 26.2.
name: Build RandomStructureChallenge

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'RandomStructureChallenge/**'
      - '.github/workflows/randomstructurechallenge.yml'
  pull_request:
    paths:
      - 'RandomStructureChallenge/**'
      - '.github/workflows/randomstructurechallenge.yml'
  workflow_dispatch:

jobs:
  build:
    name: Maven build (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -f RandomStructureChallenge/pom.xml clean package

      - name: Offline smoke test (pure logic)
        run: |
          mkdir -p smoke-classes
          javac -d smoke-classes \
            RandomStructureChallenge/smoke/SmokeTest.java \
            RandomStructureChallenge/src/main/java/dev/superseller/randomstructurechallenge/util/*.java
          java -cp smoke-classes dev.superseller.randomstructurechallenge.smoke.SmokeTest

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: RandomStructureChallenge-plugin
          path: RandomStructureChallenge/target/RandomStructureChallenge-*.jar
          if-no-files-found: error
