name: HomesGUI build

on:
  push:
    paths:
      - 'HomesGUI/**'
  pull_request:
    paths:
      - 'HomesGUI/**'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify HomesGUI with Maven
        working-directory: HomesGUI
        run: mvn -B clean verify
