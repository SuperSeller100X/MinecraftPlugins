# Copy this file to the repository root .github/workflows/ to activate it.
name: Build RapidHoppers

on:
  push:
    paths:
      - "RapidHoppers/**"
      - ".github/workflows/rapidhoppers.yml"
  pull_request:
    paths:
      - "RapidHoppers/**"
      - ".github/workflows/rapidhoppers.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Offline smoke tests (stub API)
        run: |
          cd RapidHoppers
          JAVA_BIN=java ./build.sh
      - name: Package against paper-api 26.2
        run: mvn -B -f RapidHoppers/pom.xml clean package
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RapidHoppers
          path: RapidHoppers/target/RapidHoppers-*.jar
