# ---------------------------------------------------------------------------
#  RapidHoppers - configuration
#  Minecraft 26.2 (Paper / Purpur / Folia) - Java 25
#
#  RapidHoppers changes ONE thing: how often a hopper performs its transfer.
#  The transfer itself stays exactly vanilla - one item, from the inventory
#  above into the hopper, or from the hopper into the inventory it faces.
#  Amounts, destinations and contraption behaviour are never changed.
#
#  Everything in this file can be changed in-game with /rha ... or the GUI
#  (/rha gui). Values written by commands/GUI are saved back to this file.
# ---------------------------------------------------------------------------

# Master switch. When false the plugin stays loaded but vanilla speeds apply.
enabled: true

engine:
  # How often (in server ticks) a hopper may move ONE item.
  # Vanilla is 8 ticks (2.5 items/second).
  #   8 = vanilla speed   4 = 2x (5/s)   2 = 4x (10/s)   1 = 8x (20/s)
  # Allowed: 1 - 8. There is no "items per transfer" setting on purpose:
  # moving more than one item at a time is what breaks comparators, item
  # sorters and filtered hoppers.
  interval-ticks: 2

  # Scan interval (ticks) for (re)discovering containers in loaded chunks.
  # Higher = cheaper, but newly placed containers start faster a bit later.
  scan-interval-ticks: 100

  # Only accelerate containers in chunks that have a player within this radius
  # (in chunks). 0 = accelerate every loaded chunk. Recommended: 4 - 8.
  player-activity-radius-chunks: 6

containers:
  hopper:
    enabled: true
    # Pull one item from the inventory directly above the hopper.
    pull-from-above: true
    # Push one item into the container the hopper faces.
    push-to-facing: true
  hopper-minecart:
    enabled: true
    # Pull one item from the inventory directly above the minecart. This is
    # the only container interaction vanilla gives a hopper minecart, so it is
    # the only one that is accelerated.
    pull-from-above: true

# Note: droppers, dispensers and chest minecarts are intentionally NOT handled.
# They fire on a redstone pulse (or are drained by a hopper below them) rather
# than running on a hopper clock, so there is no transfer rate to speed up -
# moving items for them would mean moving items nothing asked to be moved.
# They keep pure vanilla behaviour.

worlds:
  # Mode: BLACKLIST (accelerate everywhere except 'list') or
  #       WHITELIST (accelerate only worlds in 'list').
  mode: BLACKLIST
  list: []

performance:
  # --- TPS aware auto throttle -------------------------------------------
  throttle:
    enabled: true
    # Below this TPS hoppers step back towards vanilla speed.
    soft-tps: 18.0
    # Below this TPS acceleration stops completely (pure vanilla speed) until
    # the server recovers.
    hard-tps: 14.0
    # Interval multiplier applied while throttled (interval * this, capped at
    # vanilla's 8 ticks).
    interval-multiplier: 3
    # Seconds between throttle re-evaluations.
    check-interval-seconds: 5
    # Log a message when the throttle state changes.
    log-state-changes: true

  # Maximum number of accelerated containers per chunk (0 = unlimited).
  # Protects against giant item-sorter chunk lag.
  max-containers-per-chunk: 96

  # Maximum accelerated containers per world (0 = unlimited).
  max-containers-per-world: 20000

  # Maximum transfer operations per engine tick across the whole server.
  # 0 = unlimited. Acts as a hard CPU budget.
  max-transfers-per-tick: 2000

sounds:
  enabled: true
  gui-open:
    sound: BLOCK_BARREL_OPEN
    volume: 0.6
    pitch: 1.4
  gui-click:
    sound: UI_BUTTON_CLICK
    volume: 0.5
    pitch: 1.6
  gui-close:
    sound: BLOCK_BARREL_CLOSE
    volume: 0.6
    pitch: 1.2
  success:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.7
    pitch: 1.5
  error:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 0.7
    pitch: 0.7
  toggle-on:
    sound: BLOCK_LEVER_CLICK
    volume: 0.6
    pitch: 1.6
  toggle-off:
    sound: BLOCK_LEVER_CLICK
    volume: 0.6
    pitch: 0.8

gui:
  title: "<gradient:#38bdf8:#a855f7><bold>RapidHoppers</bold></gradient>"
  # 3, 4, 5 or 6 rows.
  rows: 5
  # Fill empty slots with this material (NONE to leave them empty).
  filler: GRAY_STAINED_GLASS_PANE
  # Refresh the live statistics inside an open GUI every n ticks (0 = off).
  refresh-ticks: 20

# Verbose logging of engine decisions. Only for debugging - very spammy.
debug: false

# Do not edit: used to migrate configs between plugin versions.
config-version: 2
