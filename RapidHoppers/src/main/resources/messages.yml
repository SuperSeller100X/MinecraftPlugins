# RapidHoppers messages - MiniMessage format. Placeholders use {name}.
prefix: "<gradient:#38bdf8:#a855f7><bold>RapidHoppers</bold></gradient> <dark_gray>» <gray>"

general:
  no-permission: "<red>You do not have permission to do that."
  players-only: "<red>Only players can use this."
  unknown-command: "<red>Unknown sub-command. Try <white>/{label} help<red>."
  invalid-number: "<red><white>{input}</white> is not a valid number."
  out-of-range: "<red>Value must be between <white>{min}</white> and <white>{max}</white>."
  reloaded: "<green>Configuration reloaded in <white>{ms}ms<green>."
  reload-failed: "<red>Reload failed: <white>{error}"
  saved: "<green>Saved to config.yml."

status:
  header: "<dark_gray><strikethrough>                    </strikethrough> <white>RapidHoppers <dark_gray><strikethrough>                    </strikethrough>"
  engine: "<gray>Engine: {state}"
  enabled: "<green>ENABLED"
  disabled: "<red>DISABLED"
  throttled: "<gold>THROTTLED"
  paused: "<red>PAUSED (low TPS)"
  interval: "<gray>Interval: <white>{interval} ticks <dark_gray>({speed}x vanilla)"
  stack: "<gray>Items per transfer: <white>{stack}"
  tracked: "<gray>Tracked containers: <white>{tracked}"
  transfers: "<gray>Transfers: <white>{total} <dark_gray>(<white>{rate}<dark_gray>/s)"
  tps: "<gray>Server TPS: <white>{tps}"
  worlds: "<gray>World mode: <white>{mode} <dark_gray>({count} listed)"
  version: "<gray>Version <white>{version} <dark_gray>· <gray>MC <white>{api} <dark_gray>· <gray>platform <white>{platform}"

admin:
  toggled: "<gray>Engine is now {state}<gray>."
  container-toggled: "<gray><white>{type}</white> acceleration is now {state}<gray>."
  world-toggled: "<gray>World <white>{world}</white> is now {state}<gray> for acceleration."
  speed-set: "<green>Transfer interval set to <white>{interval}</white> ticks <dark_gray>({speed}x vanilla)<green>."
  stack-set: "<green>Items per transfer set to <white>{stack}</white>."
  throttle-set: "<green>Auto-throttle is now {state}<green>."
  throttle-tps-set: "<green>Throttle thresholds set: soft <white>{soft}</white>, hard <white>{hard}</white>."
  limit-set: "<green>Per-chunk container limit set to <white>{limit}</white>."
  debug-set: "<gray>Debug logging is now {state}<gray>."
  unknown-world: "<red>Unknown world <white>{world}<red>."

gui:
  no-permission: "<red>You cannot open the RapidHoppers panel."
  opened: "<gray>Opening the RapidHoppers control panel…"
  read-only: "<gold>You are viewing the panel in read-only mode."
  item:
    engine-name: "<white><bold>Engine"
    engine-lore: "|<gray>Current state: {state}|<gray>|<yellow>Click <gray>to toggle"
    speed-name: "<white><bold>Transfer interval"
    speed-lore: "|<gray>Now: <white>{interval} ticks</white> <dark_gray>({speed}x)|<gray>|<yellow>Left-click <gray>faster|<yellow>Right-click <gray>slower"
    stack-name: "<white><bold>Items per transfer"
    stack-lore: "|<gray>Now: <white>{stack}</white> items|<gray>|<yellow>Left-click <gray>+1 <dark_gray>(shift +8)|<yellow>Right-click <gray>-1 <dark_gray>(shift -8)"
    containers-name: "<white><bold>Container types"
    containers-lore: "|<gray>Hopper: {hopper}|<gray>Hopper minecart: {hopper_minecart}|<gray>Chest minecart: {chest_minecart}|<gray>Dropper: {dropper}|<gray>Dispenser: {dispenser}|<gray>|<yellow>Left-click <gray>cycle & toggle"
    throttle-name: "<white><bold>TPS auto-throttle"
    throttle-lore: "|<gray>State: {state}|<gray>Soft: <white>{soft}</white> · Hard: <white>{hard}|<gray>TPS now: <white>{tps}|<gray>|<yellow>Click <gray>to toggle"
    limit-name: "<white><bold>Per-chunk limit"
    limit-lore: "|<gray>Now: <white>{limit}</white> containers|<gray>|<yellow>Left-click <gray>+8|<yellow>Right-click <gray>-8"
    stats-name: "<white><bold>Live statistics"
    stats-lore: "|<gray>Tracked: <white>{tracked}|<gray>Transfers: <white>{total}|<gray>Rate: <white>{rate}</white>/s|<gray>TPS: <white>{tps}"
    worlds-name: "<white><bold>Worlds"
    worlds-lore: "|<gray>Mode: <white>{mode}|<gray>Listed: <white>{count}|<gray>|<yellow>Click <gray>to switch mode"
    reload-name: "<white><bold>Reload configuration"
    reload-lore: "|<gray>Re-reads config.yml and messages.yml|<gray>|<yellow>Click <gray>to reload"
    close-name: "<red><bold>Close"
    close-lore: "|<gray>Close this panel"

help:
  player:
    - "<dark_gray><strikethrough>                                        </strikethrough>"
    - "<white><bold>RapidHoppers <gray>player commands"
    - "<yellow>/rh <gray>· <yellow>/rhoppers <gray>· <yellow>/rapidhoppers"
    - "<yellow>/rh i <gray>| info — plugin status"
    - "<yellow>/rh s <gray>| stats — live transfer statistics"
    - "<yellow>/rh g <gray>| gui — open the control panel"
    - "<yellow>/rh h <gray>| help — this page"
    - "<dark_gray><strikethrough>                                        </strikethrough>"
  admin:
    - "<dark_gray><strikethrough>                                        </strikethrough>"
    - "<white><bold>RapidHoppers <gray>admin commands <dark_gray>(/rha, /rhadmin)"
    - "<yellow>/rha rl <gray>| reload — reload config & messages"
    - "<yellow>/rha t <gray>| toggle [type] — engine or container type"
    - "<yellow>/rha sp <gray>| speed <1-8> — transfer interval in ticks"
    - "<yellow>/rha st <gray>| stack <1-64> — items per transfer"
    - "<yellow>/rha w <gray>| world [world] — toggle a world"
    - "<yellow>/rha th <gray>| throttle [on|off|soft <tps>|hard <tps>]"
    - "<yellow>/rha l <gray>| limit <n> — max containers per chunk"
    - "<yellow>/rha d <gray>| debug — verbose logging"
    - "<yellow>/rha i <gray>| info · <yellow>/rha s <gray>| stats · <yellow>/rha g <gray>| gui"
    - "<dark_gray><strikethrough>                                        </strikethrough>"
