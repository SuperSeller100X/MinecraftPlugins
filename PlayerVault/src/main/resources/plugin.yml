name: PlayerVault
version: '${project.version}'
main: dev.superseller.playervault.PlayerVaultPlugin
api-version: '26.2'
folia-supported: true
author: SuperSeller100X
website: https://github.com/SuperSeller100X/MinecraftPlugins
description: Per-player expandable vaults with paid row upgrades, pages and economy support. Paper / Purpur / Folia 26.2.
softdepend: [Vault, VaultUnlocked, PlaceholderAPI]

commands:
  playervault:
    description: Open, upgrade and inspect your personal vault.
    usage: |-
      /<command> [page] - open your vault
      /<command> upgrade [rows] - buy rows
      /<command> price [rows] - preview a price
      /<command> info - show your vault stats
      /<command> sort - compact your vault
      /<command> reload - reload configuration
      /<command> help - show help
    aliases: [pv, pvault, myvault]
  playervaultadmin:
    description: Administer other players' vaults.
    usage: |-
      /<command> open <player> - open a player's vault
      /<command> rows <player> <rows> - set a player's rows
      /<command> addrows <player> [rows] - grant free rows
      /<command> reset <player> - reset a player to the starting size
      /<command> clear <player> - empty a player's vault
      /<command> info <player> - inspect a player's vault
      /<command> price [rows] - preview a price
      /<command> reload - reload configuration
      /<command> help - show help
    aliases: [pva, pvadmin]
    permission: playervault.admin

permissions:
  playervault.use:
    description: Open your own vault.
    default: true
  playervault.upgrade:
    description: Buy additional vault rows with money.
    default: true
  playervault.price:
    description: Preview vault upgrade prices.
    default: true
  playervault.info:
    description: Show your own vault statistics.
    default: true
  playervault.sort:
    description: Compact the contents of your vault.
    default: true
  playervault.reload:
    description: Reload PlayerVault configuration and messages.
    default: op
  playervault.bypass.cost:
    description: Upgrade your vault without paying.
    default: op
  playervault.bypass.limit:
    description: Ignore the configured maximum row count.
    default: op
  playervault.admin.open:
    description: Open another player's vault.
    default: op
  playervault.admin.rows:
    description: Set or grant rows on another player's vault.
    default: op
  playervault.admin.reset:
    description: Reset another player's vault to the starting size.
    default: op
  playervault.admin.clear:
    description: Empty another player's vault.
    default: op
  playervault.admin.info:
    description: Inspect another player's vault.
    default: op
  playervault.admin:
    description: Every PlayerVault administrative permission.
    default: op
    children:
      playervault.admin.open: true
      playervault.admin.rows: true
      playervault.admin.reset: true
      playervault.admin.clear: true
      playervault.admin.info: true
      playervault.reload: true
  playervault.*:
    description: Every PlayerVault permission, including use.
    default: op
    children:
      playervault.use: true
      playervault.upgrade: true
      playervault.price: true
      playervault.info: true
      playervault.sort: true
      playervault.admin: true
      playervault.bypass.cost: true
      playervault.bypass.limit: true
