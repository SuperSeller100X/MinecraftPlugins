# Veltryx shop prices — the heart of the /shop and /sell GUIs.
#
# Format per item:   MATERIAL: { buy: <dollars>, sell: <dollars> }
#   buy  = what the shop charges when a player buys the item
#   sell = what /sell pays (always less than buy)
#
# Runtime safety caps base sells to half the cheapest *modeled* way to
# acquire the item and caps enchantment bonuses. The bundled model covers
# vanilla recipes and selected transformations, Fortune and container returns;
# it does not model every trade, farm, plugin or game mechanic. Values on disk
# are preserved during upgrades, even when a lower effective cap is applied.
# Potion, tipped-arrow and enchanted-book variants have fixed choice prices.
# Metadata-dependent items such as maps and potions are buy-only.

