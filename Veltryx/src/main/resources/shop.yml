# Veltryx shop prices — the heart of the /shop and /sell GUIs.
#
# Format per item:   MATERIAL: { buy: <dollars>, sell: <dollars> }
#   buy  = what the shop charges when a player buys the item
#   sell = what /sell pays (always less than buy)
#
# Anti-arbitrage rules baked into these prices:
#   - gathered resources sell at ~65% of buy (mining/farming earns money)
#   - crafted items sell at ~50% of buy and cost barely more than their
#     materials, so buy-materials -> craft -> sell always loses money:
#     you earn by gathering and selling, not by market games.
#
# Admins can edit prices freely on a live server; plugin updates only ADD
# missing items and keep your values. See README for the full format.

