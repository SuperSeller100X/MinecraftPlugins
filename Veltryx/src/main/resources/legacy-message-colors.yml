# Exact pre-palette defaults. Used only to recognize unchanged old templates;
# customized translations and intentionally empty messages always win.
economy.balance-self: "<gray>Balance:</gray> <green>{amount}</green>"
economy.balance-other: "<gray>{player}'s balance:</gray> <green>{amount}</green>"
economy.pay-sent: "<green>Sent <white>{amount}</white> to <white>{player}</white>.</green>"
economy.pay-received: "<green>Received <white>{amount}</white> from <white>{player}</white>.</green>"
shop.buy-done: "<green>Bought <white>{amount}x {item}</white> for <green>$</green><white>{price}</white>. <gray>Balance: <green>$</green><white>{balance}</white></gray></green>"
shop.sold: "<green>Sold <white>{count}x {item}</white> — <green>$</green><white>{money}</white>. <gray>Balance: <green>$</green><white>{balance}</white></gray></green>"
shop.sold-all: "<green>Sold your items — <green>$</green><white>{money}</white>. <gray>Balance: <green>$</green><white>{balance}</white></gray></green>"
home.set: "<green>Home <white>{name}</white> set. <gray>({count}/{max} homes)</gray></green>"
home.teleported: "<green>Teleported to home <white>{name}</white>.</green>"
home.renamed: "<green>Home <white>{old}</white> renamed to <white>{name}</white>.</green>"
tpa.sent: "<green>Asked <white>{player}</white> to let you teleport to them.</green>"
tpa.sent-here: "<green>Asked <white>{player}</white> to teleport to you.</green>"
tpa.received: "<green><white>{player}</white> wants to teleport to you — type <white>/tp</white> to accept. <gray>(Expires in <white>{seconds}s</white>.)</gray></green>"
tpa.received-here: "<green><white>{player}</white> wants you to teleport to them — type <white>/tp</white> to accept. <gray>(Expires in <white>{seconds}s</white>.)</gray></green>"
shards.income: "<gray>you earned 1 shard for playing the server</gray>"
shards.balance: "<gray>Shards:</gray> <aqua>{balance}</aqua>"
shards.balance-other: "<gray>{player}'s shards:</gray> <aqua>{balance}</aqua>"
shards.pay-sent: "<green>Sent <white>{amount}</white> shards to <white>{player}</white>.</green>"
shards.pay-received: "<green>Received <white>{amount}</white> shards from <white>{player}</white>.</green>"
shards.bought: "<green>Bought <white>{item}</white> for <white>{price}</white> shards.</green>"
shards.toggle-on: "<green><white>{item}</white> ability enabled.</green>"
shards.toggle-off: "<yellow><white>{item}</white> ability disabled.</yellow>"
shards.warn: "<yellow>Your <white>{item}</white> self-destructs in <white>{minutes}</white> minutes.</yellow>"
shards.totem-saved: "<green>Your Void Totem saved you from the void!</green>"
spawner.picked-up: "<green>Your {type} spawner and its stored loot were added to your inventory.</green>"
spawner.mode: "<green>Spawner mode is now <white>{mode}</white>.</green>"
settings.updated: "<gray>{setting} is now <white>{state}</white>.</gray>"
