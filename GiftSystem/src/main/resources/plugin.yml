name: GiftSystem
version: '${project.version}'
main: com.example.giftsystem.GiftSystemPlugin
api-version: '1.21'
description: A comprehensive gifting system with GUIs and admin control
author: Example

commands:
  gift:
    description: Send a gift to another player
    usage: /gift <player> [message]
    permission: giftsystem.use
  giftgui:
    description: Open your gifts GUI
    usage: /giftgui
    permission: giftsystem.use
    aliases: [gifts]
  giftadmin:
    description: Admin commands for managing gifts
    usage: /giftadmin <clear|list|reload>
    permission: giftsystem.admin

permissions:
  giftsystem.use:
    description: Allows players to send and receive gifts
    default: true
  giftsystem.admin:
    description: Allows admins to manage gifts
    default: op
