# GiftSystem Configuration

settings:
  # Enable or disable the plugin
  enabled: true
  
  # Maximum items per gift
  max-items-per-gift: 36
  
  # Gift expiration in days (0 = never expire)
  gift-expiration-days: 30
  
  # Cooldown between sending gifts in seconds
  gift-cooldown: 60
  
  # Sound played when receiving a gift
  receive-sound: ENTITY_PLAYER_LEVELUP
  
  # Sound played when claiming a gift
  claim-sound: ENTITY_EXPERIENCE_ORB_PICKUP
  
  # Message prefix
  prefix: "&6[GiftSystem] &r"
