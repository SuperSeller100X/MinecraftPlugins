# GiftSystem Configuration File

# Enable or disable the plugin
enabled: true

# Cooldown between sending gifts (in seconds)
cooldown: 60

# Maximum items per gift
max-items-per-gift: 9

# Maximum gifts a player can send per day
daily-send-limit: 10

# Gift expiration time in hours (0 = never expires)
gift-expiration-hours: 168

# Auto-save interval (in minutes)
auto-save-interval: 5

# Sound effects
sounds:
  gift-sent: ENTITY_PLAYER_LEVELUP
  gift-received: ENTITY_EXPERIENCE_ORB_PICKUP
  gift-opened: ENTITY_PLAYER_LEVELUP
  gui-open: UI_BUTTON_CLICK
  error: BLOCK_ANVIL_LAND

# Messages
messages:
  prefix: "&8[&aGiftSystem&8] "
  gift-sent: "&aYou sent a gift to &e%player%&a!"
  gift-received: "&aYou received a gift from &e%player%&a!"
  gift-opened: "&aYou opened a gift from &e%player%&a! Received: %items%"
  no-permission: "&cYou don't have permission to do that!"
  player-only: "&cThis command can only be used by players!"
  player-not-found: "&cPlayer not found!"
  cooldown-active: "&ePlease wait %seconds% seconds before sending another gift!"
  daily-limit-reached: "&cYou have reached your daily gift sending limit!"
  too-many-items: "&cYou can only send up to %max% items per gift!"
  no-items: "&cYou must hold items to send a gift!"
  self-gift: "&cYou cannot send a gift to yourself!"
  inbox-empty: "&7Your gift inbox is empty."
  admin-cleared: "&aCleared all gifts for %player%!"
  admin-reload: "&aConfiguration reloaded successfully!"
  gui-title-inbox: "&6Gift Inbox"
  gui-title-create: "&6Create Gift"

# GUI Settings
gui:
  rows: 5
  fill-material: GRAY_STAINED_GLASS_PANE
  next-page-material: ARROW
  previous-page-material: ARROW

# Database settings (SQLite by default)
database:
  type: "sqlite" # sqlite or mysql
  mysql:
    host: "localhost"
    port: 3306
    database: "giftsystem"
    username: "root"
    password: ""
