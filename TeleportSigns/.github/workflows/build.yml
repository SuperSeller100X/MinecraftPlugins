# CI build for TeleportSigns.
#
# NOTE: GitHub only executes workflows located at the REPOSITORY ROOT under
# .github/workflows/. This copy lives inside the plugin folder because the
# automation that opened the pull request is not allowed to add files to the
# root .github/workflows/ directory. To activate this CI pipeline, copy this
# file to <repo-root>/.github/workflows/teleportsigns.yml — no other changes
# are required.
name: Build TeleportSigns

on:
  push:
    branches: [main]
    paths: ['TeleportSigns/**']
  pull_request:
    paths: ['TeleportSigns/**']
  workflow_dispatch:

jobs:
  build:
    name: Maven build (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -f TeleportSigns/pom.xml clean package

      - name: Offline smoke test (pure logic)
        run: |
          mkdir -p smoke-classes
          javac -d smoke-classes \
            TeleportSigns/smoke/SmokeTest.java \
            TeleportSigns/src/main/java/dev/superseller/teleportsigns/util/*.java \
            TeleportSigns/src/main/java/dev/superseller/teleportsigns/command/DestinationParser.java \
            TeleportSigns/src/main/java/dev/superseller/teleportsigns/model/*.java \
            TeleportSigns/src/main/java/dev/superseller/teleportsigns/service/SafetyChecker.java
          java -cp smoke-classes dev.superseller.teleportsigns.smoke.SmokeTest

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: TeleportSigns-plugin
          path: TeleportSigns/target/TeleportSigns-*.jar
          if-no-files-found: error
