# CI build for PlayerHeads.
#
# NOTE: GitHub only executes workflows located at the REPOSITORY ROOT under
# .github/workflows/. This copy lives inside the plugin folder because the
# automation that opened the pull request is not allowed to add files to the
# root .github/workflows/ directory. To activate this CI pipeline, copy this
# file to <repo-root>/.github/workflows/playerheads.yml (keep the name or use
# any name ending in .yml) — no other changes are required.
name: Build PlayerHeads

on:
  push:
    branches: [main]
    paths: ['PlayerHeads/**']
  pull_request:
    paths: ['PlayerHeads/**']
  workflow_dispatch:

jobs:
  build:
    name: Maven build (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -f PlayerHeads/pom.xml clean package

      - name: Offline smoke test (pure logic)
        run: |
          mkdir -p smoke-classes
          javac -d smoke-classes \
            PlayerHeads/smoke/SmokeTest.java \
            PlayerHeads/src/main/java/dev/superseller/playerheads/util/*.java
          java -cp smoke-classes dev.superseller.playerheads.smoke.SmokeTest

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PlayerHeads-plugin
          path: PlayerHeads/target/PlayerHeads-*.jar
          if-no-files-found: error

  server-smoke:
    name: Live Paper 26.2 server smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: PlayerHeads-plugin
          path: plugin

      - name: Download latest Paper 26.2 (Fill API)
        run: |
          set -euo pipefail
          LATEST="$(curl -fsSL 'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds/latest')"
          URL="$(echo "$LATEST" | jq -r '.downloads["server:default"].url')"
          NAME="$(echo "$LATEST" | jq -r '.downloads["server:default"].name')"
          echo "Downloading $NAME ..."
          curl -fLo paper.jar "$URL"

      - name: Boot Paper 26.2 with PlayerHeads
        run: |
          set -euo pipefail
          mkdir -p server/plugins
          cp plugin/PlayerHeads-*.jar server/plugins/
          cp paper.jar server/paper.jar
          cd server
          echo 'eula=true' > eula.txt
          echo 'online-mode=false' >> server.properties
          # Feed console commands after the server has booted, then stop it.
          ( sleep 120; echo 'ph Notch 5'; sleep 8; echo 'playerheads reload'; sleep 8; echo 'stop' ) \
            | java -Xms512M -Xmx2G -jar paper.jar nogui > boot.log 2>&1 || true
          echo '--- boot.log (tail 60) ---'
          tail -n 60 boot.log

      - name: Assert plugin behaviour
        run: |
          set -euo pipefail
          grep -q  'PlayerHeads enabled' server/boot.log
          grep -qi 'Only players can receive heads' server/boot.log
          grep -qi 'Configuration and messages reloaded' server/boot.log
          echo 'Server smoke test OK'
