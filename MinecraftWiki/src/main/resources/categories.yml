# ===========================================================================
#  MinecraftWiki - categories.yml
#
#  Every category on the wiki home. Each one is independent: enable or disable
#  it, rename it, re-order it, change its icon, restrict it with a permission.
#
#  A category is only shown when it is enabled AND (unless category.show-empty
#  is true in gui.yml) it actually contains at least one article. Categories
#  marked "data source" are filled automatically from the running server by a
#  content provider. The topic categories have no automatic source: they appear
#  as soon as you add articles for them in articles.yml.
#
#  This file ships without any article of its own - it describes the wiki, it
#  does not invent content.
# ===========================================================================

categories:

