name: ConnectedTools
version: 1.0.0
main: dev.superseller.connectedtools.ConnectedToolsPlugin
api-version: '26.2'
folia-supported: true
load: STARTUP
softdepend: [Folia]

description: 'Connect items and tools to redstone, storage, and other blocks. Commands, GUI, and permissions for Minecraft 26.2 (Paper / Purpur / Folia).'

author: SuperSeller100X
website: https://github.com/SuperSeller100X/MinecraftPlugins

commands:
  connectedtools:
    description: Main command for ConnectedTools.
    aliases: [ct, conn, conntools]
    usage: /<command> [connect|disconnect|list|info|reload|gui|c|d|l|i]

permissions:
  connectedtools.connect:
    description: Allows connecting an item to a block.
    default: true
  connectedtools.disconnect:
    description: Allows disconnecting an item from a block.
    default: true
  connectedtools.list:
    description: Allows listing connections.
    default: true
  connectedtools.info:
    description: Allows viewing connection info.
    default: true
  connectedtools.reload:
    description: Allows reloading the plugin config.
    default: op
  connectedtools.gui:
    description: Allows opening the connection GUI.
    default: true
  connectedtools.all:
    description: Full access to all ConnectedTools features.
    default: false
    children:
      connectedtools.connect: true
      connectedtools.disconnect: true
      connectedtools.list: true
      connectedtools.info: true
      connectedtools.reload: true
      connectedtools.gui: true
