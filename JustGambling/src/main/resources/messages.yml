# MiniMessage language file. All messages are configurable and reloadable.
prefix: "<dark_gray>[<gold>JustGambling</gold>] <gray>"

no-permission: "<red>You do not have permission to do that.</red>"
player-only: "<red>Only a player can use this command.</red>"
unknown-subcommand: "<red>Unknown subcommand. Use <white>/jg help</white>.</red>"
unknown-admin-subcommand: "<red>Unknown admin subcommand. Use <white>/jga</white>.</red>"
usage-play: "<yellow>Usage: <white>/jg play <game> <amount> [risk] [choice]</white></yellow>"
unknown-game: "<red>Unknown game. Use <white>/jg games</white>.</red>"
unknown-option: "<red>That game choice is not valid.</red>"
invalid-option: "<red>Please choose a valid option for <white>{game}</white>.</red>"
game-disabled: "<red><white>{game}</white> is currently disabled.</red>"
economy-unavailable: "<red>No economy is available. Install Vault with an economy provider, or enable the fallback currency.</red>"
invalid-amount: "<red>Enter a positive finite amount such as <white>100</white>, <white>1.5k</white>, <white>1q</white>, or <white>all</white>.</red>"
invalid-stake: "<red>Your stake must be at least <white>{minimum}</white>.</red>"
stake-too-high: "<red>That stake exceeds the configured maximum of <white>{maximum}</white>.</red>"
payout-too-large: "<red>This wager would create an unsafe or over-sized payout and was cancelled.</red>"
not-enough-money: "<red>You cannot afford that wager. Available: <white>{balance}</white>.</red>"
cooldown: "<yellow>Please wait <white>{seconds}s</white> before wagering again.</yellow>"
payout-failed: "<red>The payout provider failed. Your original stake was refunded; an administrator should inspect the console.</red>"
wager-pending: "<yellow>Your previous wager is still resolving. Please wait for the animation to finish.</yellow>"
active-mines: "<yellow>You already have an active Mines board. Reveal a tile or use <white>/jg cashout</white>.</yellow>"
no-active-mines: "<yellow>You do not have an active Mines board.</yellow>"
amount-prompt: "<aqua>Type a stake for <white>{game}</white> in chat, or type <white>cancel</white>.</aqua>"
input-cancelled: "<gray>Stake input cancelled.</gray>"

balance: "<green>Balance: <white>{balance}</white> <gray>via <white>{provider}</white>.</gray>"
game-win: "<green>You won <white>{payout}</white>!</green> <gray>{game} • stake {stake} • net {net} • {details}</gray>"
game-loss: "<red>You lost <white>{stake}</white>.</red> <gray>{game} • {details}</gray>"
announcement: "<gold>✦ <white>{player}</white> hit a <white>{game}</white> payout of <green>{payout}</green><gold>!</gold>"

mines-start: "<aqua>Mines started:</aqua> <gray>stake {stake} • risk {risk} • mines {mines}. Close the board to cash out safely.</gray>"
mines-safe: "<green>Safe tile!</green> <gray>{safe} safe tile(s) • current multiplier {multiplier}x.</gray>"
mines-hit: "<red>Mine hit!</red> <gray>Your stake was lost after {safe} safe tile(s).</gray>"
mines-cashout: "<green>Mines cashed out for <white>{payout}</white></green> <gray>at {multiplier}x after {safe} safe tile(s).</gray>"

games-header: "<gold>Available house games:</gold>"
games-line: "<gray>• <white>{name}</white> (<yellow>{game}</yellow>) — {status}</gray>"
stats: "<gold>Stats for <white>{player}</white>:</gold> <gray>games {games} • wins {wins} • losses {losses} • win rate {rate} • wagered {wagered} • paid {paid} • best net win {best}</gray>"

reloaded: "<green>Configuration and messages reloaded.</green>"
reload-from-admin: "<yellow>Use <white>/jga reload</white> for administrative reloads.</yellow>"

admin-status: "<gold>JustGambling status:</gold> <gray>economy <white>{provider}</white> • Folia scheduler <white>{folia}</white> • jackpot <white>{jackpot}</white> • active Mines <white>{active}</white> • pending animations <white>{pending}</white></gray>"
admin-rules: "<gold>Rules:</gold> <gray>minimum stake <white>{minimum}</white> • maximum stake <white>{maximum}</white> • maximum payout <white>{payout}</white> • cooldown <white>{cooldown}s</white></gray>"
admin-risk: "<gray>Risk <white>{risk}</white>: chance <white>{chance}%</white>, payout <white>{multiplier}x</white>.</gray>"
admin-refund-usage: "<yellow>Usage: <white>/jga refund|recover <player> <amount></white></yellow>"
admin-refunded: "<green>Recovered <white>{amount}</white> to <white>{player}</white> through the active economy.</green>"
admin-refund-failed: "<red>Could not issue a recovery refund to <white>{player}</white>.</red>"
admin-game-required: "<red>Specify a valid game.</red>"
admin-player-required: "<red>Specify a player name.</red>"
admin-balance-usage: "<yellow>Usage: <white>/jga set|give|take <player> <amount></white></yellow>"
admin-balance-updated: "<green>Fallback balance for <white>{player}</white> is now <white>{balance}</white>.</green>"
admin-balance-too-low: "<red>Fallback balance for <white>{player}</white> is too low.</red>"
amount-overflow: "<red>That balance would overflow a finite number.</red>"
admin-reset: "<green>Reset fallback balance and statistics for <white>{player}</white>.</green>"
admin-pool: "<gold>House jackpot pool: <white>{pool}</white></gold>"
admin-pool-usage: "<yellow>Usage: <white>/jga pool info|set|add [amount]</white></yellow>"

help:
  - "<gold><bold>JustGambling</bold></gold> <gray>— house-only money games</gray>"
  - "<yellow>/jg</yellow> <gray>open the casino GUI</gray>"
  - "<yellow>/jg play <game> <amount> [risk] [choice]</yellow> <gray>play directly</gray>"
  - "<yellow>/jg games</yellow> <gray>list all games</gray>"
  - "<yellow>/jg balance</yellow> <gray>show the active economy balance</gray>"
  - "<yellow>/jg history [page]</yellow> <gray>open your audit history</gray>"
  - "<yellow>/jg stats [player]</yellow> <gray>view statistics</gray>"
  - "<yellow>/jg cashout</yellow> <gray>cash out an active Mines board</gray>"
  - "<gray>Risk tiers: safe, balanced, risky, extreme. Higher risk means lower chance and higher payout.</gray>"
  - "<gray>Short aliases: /jg, /jg p, /jg b, /jg h, /jg st, /jg co, /jga.</gray>"
