prefix: '<dark_gray>[<gold>ChestLock</gold>]</dark_gray> '

permission-denied: '<red>You do not have permission to do that.</red>'
players-only: '<red>This command can only be used by a player.</red>'
no-target: '<red>Look directly at a supported container within {distance} blocks.</red>'
unsupported-container: '<red>That container type cannot be locked.</red>'
already-locked: '<red>That container is already locked.</red>'
not-locked: '<yellow>That container is not locked.</yellow>'
corrupt-lock: '<red>This lock is incomplete. Ask an administrator to use <white>/cl fr</white>.</red>'
not-owner: '<red>Only this lock’s owner may manage it.</red>'
world-unavailable: '<red>That world is no longer available.</red>'
target-changed: '<red>The target changed while the dialog was open. Please try again.</red>'
invalid-passcode: '<red>Passcodes must contain {min}–{max} characters, have no control characters, and no leading or trailing spaces.</red>'
passcodes-differ: '<red>The two passcode fields do not match.</red>'
wrong-passcode: '<red>Incorrect passcode.</red>'
cooldown: '<red>Too many failed attempts. Try again in {seconds} seconds.</red>'
unlocked: '<green>Unlocked for {duration}. You may open or physically break this container.</green>'
locked-created: '<green>Container locked for {duration} per successful unlock.</green>'
lock-removed: '<green>The lock was removed.</green>'
passcode-changed: '<green>The passcode was changed.</green>'
key-issued: '<green>A key bound to this container was issued.</green>'
keys-revoked: '<green>Old keys were revoked and a replacement was issued.</green>'
key-inventory-full: '<yellow>Your inventory was full, so the key was dropped at your feet.</yellow>'
locked-container: '<red>Locked. Look at it and use <white>/cl unlock</white>, or hold its key.</red>'
break-confirm: '<yellow>Break this container again within {seconds} seconds to confirm.</yellow>'
settings-saved: '<green>Your personal ChestLock defaults were saved.</green>'
reloaded: '<green>Configuration and messages reloaded.</green>'
bypass-enabled: '<yellow>Administrative bypass enabled. Locked containers can now be opened and broken.</yellow>'
bypass-disabled: '<green>Administrative bypass disabled.</green>'
force-removed: '<yellow>The lock was forcibly removed.</yellow>'
auto-open-skipped: '<yellow>Unlocked, but auto-open was skipped because you moved away.</yellow>'
owner-attempt-alert: '<yellow>{player} entered a wrong passcode for your lock at {location}.</yellow>'
operation-failed: '<red>The operation failed safely. Check the server log and try again.</red>'
dialog-expired: '<yellow>That dialog expired. Run the command again.</yellow>'
key-crafting-blocked: '<red>ChestLock keys cannot be used as crafting ingredients.</red>'
