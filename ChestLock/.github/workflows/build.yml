name: ChestLock CI

on:
  push:
    paths:
      - 'ChestLock/**'
      - '.github/workflows/chestlock.yml'
  pull_request:
    paths:
      - 'ChestLock/**'
      - '.github/workflows/chestlock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ChestLock
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test and package
        run: mvn -B -ntp clean verify
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ChestLock
          path: ChestLock/target/ChestLock-*.jar
          if-no-files-found: error
