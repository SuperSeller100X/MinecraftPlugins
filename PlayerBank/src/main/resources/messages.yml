prefix: "<gold>[PlayerBank]</gold> "

no-permission: "<red>You do not have permission to do that."
player-only: "<red>Only players can use this command."
unknown-player: "<red>Unknown player: <white>{player}"
invalid-amount: "<red>That is not a valid amount."
economy-missing: "<red>No wallet economy is available (Vault or EssentialsX). Bank transfers are disabled."
below-min: "<red>Minimum transaction is <white>{amount}</white>."
above-max: "<red>Maximum for this action is <white>{amount}</white>."
insufficient-wallet: "<red>You only have <white>{amount}</white> in your wallet."
insufficient-bank: "<red>You only have <white>{amount}</white> in your bank."
not-enough-wallet: "<red>The economy plugin rejected the withdraw from your wallet."
not-enough-bank: "<red>Could not complete that bank operation."

balance-self: "<gray>Bank: <green>{bank}</green>  Wallet: <yellow>{wallet}"
balance-other: "<gray>{player}'s bank: <green>{bank}"

deposit-success: "<green>Deposited <white>{amount}</white> into your bank. New bank balance: <white>{bank}"
withdraw-success: "<green>Withdrew <white>{amount}</white> from your bank. New bank balance: <white>{bank}"
deposit-all: "<green>Deposited your entire wallet (<white>{amount}</white>)."
withdraw-all: "<green>Withdrew your entire bank (<white>{amount}</white>)."

interest-lookup: "<gray>Rate: <white>{rate}%</white> every <white>{interval}</white> (compound). Next tick in <white>{next}</white>."
interest-disabled: "<gray>Interest is currently disabled."
interest-received: "<green>Bank interest: +<white>{amount}</white> ({rate}%). New balance: <white>{bank}"
interest-forced: "<green>Forced an interest tick. Accounts updated: <white>{count}"

logs-header: "<gold>Bank logs</gold> <gray>(page {page}/{pages}) for <white>{player}"
logs-empty: "<gray>No bank activity yet."
logs-line: "<dark_gray>[{time}]</dark_gray> <white>{type}</white> <yellow>{amount}</yellow> <gray>{note}"

refresh-ok: "<green>Config reloaded and interest timer restarted."
reload-ok: "<green>PlayerBank configuration reloaded."
admin-set: "<green>Set <white>{player}</white>'s bank to <white>{amount}</white>."
admin-give: "<green>Added <white>{amount}</white> to <white>{player}</white>'s bank. Now <white>{bank}</white>."
admin-take: "<green>Removed <white>{amount}</white> from <white>{player}</white>'s bank. Now <white>{bank}</white>."

gui-style-set: "<green>Bank menu switched to <white>{style}</white>."
gui-style-locked: "<red>The server fixes the menu style for everyone (currently <white>{style}</white>)."
gui-style-invalid: "<red>Unknown menu style <white>{input}</white>. Use <white>chest</white> or <white>dialog</white>."

gui:
  chest:
    info-name: "<gold>Bank</gold> <dark_gray>· {player}"
    info-lore:
      - "<gray>Bank: <green>{bank}</green>   Wallet: <yellow>{wallet}"
      - "<dark_gray>Interest: {rate}% every {interval}"
      - "<dark_gray>Next payout in {next}"
      - "<dark_gray>Limits: min {min} · max deposit {maxd} · max withdraw {maxw}"
    deposit-name: "<green>Deposit {amount}"
    deposit-lore:
      - "<gray>Move <yellow>{amount}</yellow> from your wallet"
      - "<gray>into the bank."
    deposit-all-name: "<green>Deposit everything"
    deposit-all-lore:
      - "<gray>Move your <yellow>entire wallet</yellow> into the bank."
    withdraw-name: "<yellow>Withdraw {amount}"
    withdraw-lore:
      - "<gray>Move <yellow>{amount}</yellow> from your bank"
      - "<gray>back into the wallet."
    withdraw-all-name: "<yellow>Withdraw everything"
    withdraw-all-lore:
      - "<gray>Move your <yellow>entire bank</yellow> into the wallet."
    interest-name: "<aqua>Interest"
    interest-lore:
      - "<gray>{rate}% compound every {interval}."
      - "<gray>Next payout in <white>{next}</white>."
      - "<dark_gray>Click for details."
    interest-disabled-name: "<dark_gray>Interest"
    interest-disabled-lore:
      - "<gray>Interest is currently disabled."
    interest-view-name: "<aqua>Interest details"
    interest-view-lore:
      - "<gray>Rate: <white>{rate}%</white> compound"
      - "<gray>Interval: <white>{interval}</white> (real time)"
      - "<gray>Next payout in <white>{next}</white>"
      - "<gray>Paid from: <white>{minbal}</white> minimum balance"
      - "<gray>Balance cap: <white>{cap}</white>"
    logs-name: "<aqua>Transaction logs"
    logs-lore:
      - "<gray>Browse your recent bank activity."
    logs-title-name: "<gold>Transaction logs</gold> <dark_gray>({page}/{pages})"
    log-entry-name: "<white>{type}</white> <yellow>{amount}"
    log-entry-lore:
      - "<dark_gray>{time}"
      - "<gray>{note}"
    page-previous-name: "<yellow>Previous page"
    page-next-name: "<yellow>Next page"
    page-indicator-name: "<gray>Page {page}/{pages}"
    back-name: "<red>Back"
    close-name: "<red>Close"
    style-name: "<gray>Menu style: <white>{style}</white>"
    style-lore:
      - "<gray>Click to switch between the chest"
      - "<gray>menu and the native menu screens."
  dialog:
    title: "<gold>PlayerBank"
    body:
      - "<gray>Bank: <green>{bank}</green>   Wallet: <yellow>{wallet}"
      - "<dark_gray>Interest: {rate}% every {interval} · next payout in {next}"
    deposit-label: "Deposit {amount}"
    deposit-tooltip: "Move {amount} from your wallet into the bank."
    deposit-all-label: "Deposit all"
    deposit-all-tooltip: "Move your entire wallet into the bank."
    custom-deposit-label: "Deposit…"
    custom-deposit-tooltip: "Type any amount (1k, 2.5m, half, all, 25%)."
    withdraw-label: "Withdraw {amount}"
    withdraw-tooltip: "Move {amount} from your bank into the wallet."
    withdraw-all-label: "Withdraw all"
    withdraw-all-tooltip: "Move your entire bank into the wallet."
    custom-withdraw-label: "Withdraw…"
    custom-withdraw-tooltip: "Type any amount (1k, 2.5m, half, all, 25%)."
    interest-label: "Interest"
    interest-tooltip: "Rate, interval and the next payout."
    logs-label: "Logs"
    logs-tooltip: "Your recent bank activity."
    style-chest-label: "Use chest menu"
    style-tooltip: "Switch your bank menu to a chest inventory."
    deposit-title: "<green>Deposit"
    deposit-input-body: "Type the amount to deposit: plain numbers, 1k / 2.5m, half, all or 25%."
    withdraw-title: "<yellow>Withdraw"
    withdraw-input-body: "Type the amount to withdraw: plain numbers, 1k / 2.5m, half, all or 25%."
    amount-label: "Amount"
    submit-label: "Transfer"
    cancel-label: "Cancel"
    close-label: "Close"
    back-label: "Back"
    interest-title: "<aqua>Interest"
    interest-body:
      - "<gray>Rate: {rate}% compound every {interval} (real time)."
      - "<gray>Next payout in {next}."
      - "<gray>Paid on balances of at least {minbal}; balance cap {cap}."
    logs-title: "<gold>Transaction logs</gold> <dark_gray>({page}/{pages})"
    logs-line: "<dark_gray>{time}</dark_gray> <white>{type}</white> <yellow>{amount}</yellow> <gray>{note}"
    previous-page-label: "Previous page"
    next-page-label: "Next page"

help:
  - "<gold>PlayerBank commands"
  - "<yellow>/bank</yellow> <gray>— show balances"
  - "<yellow>/bank gui [chest|dialog]</yellow> <gray>— open the bank menu"
  - "<yellow>/bank deposit <amount|all></yellow> <gray>— wallet → bank"
  - "<yellow>/bank withdraw <amount|all></yellow> <gray>— bank → wallet"
  - "<yellow>/bank interest</yellow> <gray>— look up rate & interval"
  - "<yellow>/bank logs [page]</yellow> <gray>— transaction history"
  - "<yellow>/bank refresh</yellow> <gray>— reload config (staff)"
  - "<gray>The bank is isolated: other plugins cannot spend it."
