name: PlayerBank CI

on:
  push:
    paths:
      - 'PlayerBank/**'
      - 'PlayerBank/.github/workflows/build.yml'
  pull_request:
    paths:
      - 'PlayerBank/**'
      - 'PlayerBank/.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlayerBank
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run offline consistency checks and smoke tests
        run: |
          pip install pyyaml -q
          ./build.sh

      - name: Test and package
        run: mvn -B -ntp clean verify

      - name: Show the built jar
        run: |
          ls -lh target/*.jar
          unzip -l target/PlayerBank-*.jar | head -20

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: PlayerBank
          path: PlayerBank/target/PlayerBank-*.jar
          if-no-files-found: error
