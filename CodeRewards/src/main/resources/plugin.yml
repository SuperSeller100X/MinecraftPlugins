name: CodeRewards
version: 1.0.0
main: com.plugins.coderewards.CodeRewards
api-version: '1.21'
description: A code redemption system with rewards and GUI
author: PluginDeveloper
website: https://example.com

commands:
  coderedeem:
    description: Redeem a code for rewards
    usage: /coderedeem <code>
    aliases: [redeemcode, cr]
  coderewards:
    description: Open the code rewards GUI
    usage: /coderewards
    aliases: [cr gui, codes]
  codeadmin:
    description: Admin commands for code management
    usage: /codeadmin <create|delete|list|reload> [args]
    permission: coderewards.admin

permissions:
  coderewards.use:
    description: Allows players to redeem codes
    default: true
  coderewards.admin:
    description: Allows access to admin commands
    default: op
  coderewards.bypass:
    description: Bypass cooldowns and limits
    default: op
