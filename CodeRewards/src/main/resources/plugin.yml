name: CodeRewards
version: '${project.version}'
main: com.example.coderewards.CodeRewardsPlugin
api-version: '1.21'
description: A plugin for redeeming codes for rewards with admin control and GUIs
author: Example

commands:
  code:
    description: Redeem a reward code or open the code GUI
    usage: /code [code]
    permission: coderewards.use
  codeadmin:
    description: Admin commands for managing codes
    usage: /codeadmin <add|remove|list|reload>
    permission: coderewards.admin

permissions:
  coderewards.use:
    description: Allows players to redeem codes
    default: true
  coderewards.admin:
    description: Allows admins to manage codes
    default: op
