# CodeRewards Configuration File

# Enable or disable the plugin
enabled: true

# Cooldown between code redemptions (in seconds)
cooldown: 30

# Maximum codes a player can redeem per day
daily-limit: 10

# Auto-save interval (in minutes)
auto-save-interval: 5

# Sound effects
sounds:
  success: ENTITY_PLAYER_LEVELUP
  error: BLOCK_ANVIL_LAND
  gui-open: UI_BUTTON_CLICK

# Messages
messages:
  prefix: "&8[&6CodeRewards&8] "
  code-redeemed: "&aSuccessfully redeemed code! You received: %reward%"
  code-invalid: "&cInvalid or expired code!"
  code-already-used: "&cYou have already used this code!"
  cooldown-active: "&ePlease wait %seconds% seconds before redeeming another code!"
  daily-limit-reached: "&cYou have reached your daily code redemption limit!"
  no-permission: "&cYou don't have permission to do that!"
  player-only: "&cThis command can only be used by players!"
  admin-code-created: "&aCode created successfully: &6%code%"
  admin-code-deleted: "&aCode deleted successfully!"
  admin-code-not-found: "&cCode not found!"
  admin-reload: "&aConfiguration reloaded successfully!"
  gui-title: "&6Code Rewards"

# Reward types supported: money, items, commands, xp
default-reward-type: "commands"

# Database settings (SQLite by default)
database:
  type: "sqlite" # sqlite or mysql
  mysql:
    host: "localhost"
    port: 3306
    database: "coderewards"
    username: "root"
    password: ""
