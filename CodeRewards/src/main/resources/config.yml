# CodeRewards Configuration
# Default configuration for the plugin

settings:
  # Enable or disable the plugin
  enabled: true
  
  # Sound played when redeeming a code
  redeem-sound: ENTITY_PLAYER_LEVELUP
  
  # Message prefix
  prefix: "&6[CodeRewards] &r"

# Default reward codes (can also be managed via /codeadmin)
codes:
  WELCOME:
    commands:
      - "give {player} diamond 5"
      - "say {player} claimed the welcome reward!"
    items: []
    maxUses: -1
    oneTimePerPlayer: true
    redeemedBy: []
  SUMMER2024:
    commands:
      - "give {player} emerald 10"
    items: []
    maxUses: 100
    oneTimePerPlayer: true
    redeemedBy: []
